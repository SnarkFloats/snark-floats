function ownedRow(s){let f=state.feedback[s.id];return `<div><div class="bookrow">${cover(s)}<div class="grow"><button class="link" onclick="showStory(${s.id})"><strong>${esc(s.title)}</strong></button><br><small>${esc(s.author)} · ${s.mins} min</small><br><span class="rating">${f?.rating?Array.from({length:5},(_,i)=>flame(i<f.rating)).join('')+' Your rating: '+f.rating+'/5':'Not rated'}</span></div><button onclick="openFeedback(${s.id})">${f?'Edit feedback':'Rate / suggest tags'}</button><button aria-label="Add owned story to My Book" onclick="add(${s.id})">${state.book.includes(s.id)?'Added':'Add to My Book'}</button></div>${editing===s.id?feedbackForm(s):''}</div>`}
function library(){let tabs=['My Books','My Stories','Favorites','Following','Saved Searches'];let content='';if(libTab==='My Books')content=state.purchases.length?`<div class="grid editionsgrid">${state.purchases.map((p,i)=>`<article class="card editioncard"><button class="coverlink" onclick="viewEdition(${i})" aria-label="View ${esc(p.title)}">${editionCover(p)}</button><h3>${esc(p.title)}</h3><p>${p.ids.length} stories · ${editionAuthors(p).length} authors · ${duration(p.ids.reduce((n,id)=>n+by(id).mins,0))}</p><div class="actions"><button class="primary" onclick="viewEdition(${i})">View book</button><button onclick="downloadEdition(${i})">Download sample</button></div></article>`).join('')}</div>`:'<div class="empty">Your customized books will appear here.</div>' ;if(libTab==='My Stories'){let ss=state.owned.map(by).filter(s=>!unrated||!state.feedback[s.id]?.rating);content=`<div class="toolbar"><strong>${ss.length} stories</strong><label><input type="checkbox" ${unrated?'checked':''} onchange="unrated=this.checked;editing=null;render()"> Unrated stories only</label></div><div class="librarylist">${ss.map(ownedRow).join('')||'<div class="empty">No matching owned stories.</div>'}</div>`}if(libTab==='Favorites')content=state.favorites.length?grid(state.favorites.map(by)):'<div class="empty">No favorites yet.</div>';if(libTab==='Following')content=state.follow.map(a=>{let ss=stories.filter(s=>s.author===a);return `<div class="bookrow"><div class="grow"><button class="link" onclick="showAuthor(${ss[0].id})"><strong>${esc(a)}</strong></button><br><small>${ss.length} stories · View author catalog</small></div><button onclick="state.follow=state.follow.filter(x=>x!==by(${ss[0].id}).author);save();render()">Following ✓</button></div>`}).join('')||'<div class="empty">No followed authors yet.</div>';if(libTab==='Saved Searches')content=state.saved.map((f,i)=>`<p><button onclick="discover(state.saved[${i}])">${esc([f.q,f.genre,f.include,f.exclude?'Exclude '+f.exclude:'',f.max?f.max+' min':''].filter(Boolean).join(' · ')||'All stories')}</button></p>`).join('')||'<div class="empty">No saved searches yet.</div>';return `<h1>My Library</h1><div class="librarytabs" role="tablist" aria-label="Library sections">${tabs.map(t=>`<button aria-selected="${libTab===t}" role="tab" onclick="switchLib('${t}')">${t}</button>`).join('')}</div><section aria-label="${libTab}">${content}</section>`}
let tagQuery='',tagSelected='Comedy';const directory=[...new Set([...tags,...Object.keys(narrower),...Object.values(narrower).flat(),...Object.values(related).flat()])].sort();const definitions={'Comedy':'Fiction that uses humor, wit or absurdity to entertain or provoke thought.','Satire':'Humor, irony or exaggeration used to critique society or institutions.','Dark Humor':'Humor involving uncomfortable or disturbing subjects.','Psychological Horror':'Horror centered on fear, perception and the mind.','Sexual Content':'Sexual material, whether explicit or non-explicit.','Erotica':'Fiction centered on erotic experiences.','Humorous Fiction':'Fiction primarily intended to amuse.'};function tagCategory(t){if(genres.includes(t))return 'Genres';if(stories.some(s=>s.sub===t)||Object.values(narrower).flat().includes(t)&&!t.includes('Sexual Content'))return 'Subgenres and related styles';if(stories.some(s=>s.warnings.split('|').includes(t))||t.includes('Sexual Content'))return 'Content warnings';return 'Themes, tropes and moods'}function selectTag(t){tagSelected=t;render()}function tagLink(t){return `<button class="tag" data-meta="${esc(t)}" onclick="selectTag(this.dataset.meta)">${esc(t)}</button>`}function tagList(){return ['Genres','Subgenres and related styles','Themes, tropes and moods','Content warnings'].map(c=>{let ts=directory.filter(t=>tagCategory(t)===c&&t.toLowerCase().includes(tagQuery.toLowerCase()));return ts.length?`<h3>${c}</h3><div class="taglist">${ts.map(tagLink).join('')}</div>`:''}).join('')||'<p>No matching tags.</p>'}function tagExplorer(){let t=tagSelected,parents=Object.keys(narrower).filter(k=>narrower[k].includes(t)),children=narrower[t]||[],associations=[...new Set([...(related[t]||[]),...Object.keys(related).filter(k=>related[k].includes(t))])];return `${backLink()}<h1>Explore our tags</h1><p>Discover how genres, themes and stories connect.</p><div class="layout taglayout"><section><input aria-label="Search tags" placeholder="Search all tags…" value="${esc(tagQuery)}" oninput="tagQuery=this.value;$('taglist').innerHTML=tagList()"><div id="taglist">${tagList()}</div></section><aside class="filters"><h2>${esc(t)}</h2><p>${tagCategory(t)} · ${stories.filter(s=>matches(s,t)).length} matching stories</p><p>${esc(definitions[t]||'Catalog descriptor: '+t+'.')}</p>${[['Broader categories',parents],['Narrower categories',children],['Related concepts',associations]].map(([label,items])=>items.length?`<h3>${label}</h3>${items.map(tagLink).join('')}`:'').join('')}<p><button class="primary" data-meta="${esc(t)}" onclick="browseMeta('include',this.dataset.meta)">Explore matching stories</button></p></aside></div><section class="band section"><h2>Something missing?</h2><p>Suggest a tag for editorial consideration. Suggestions are not automatically added.</p><form onsubmit="suggestTag(event)"><label for="suggestname">Suggested tag</label><input id="suggestname" required maxlength="100"><label for="suggestcategory">Category</label><select id="suggestcategory">${['Not sure','Genre','Subgenre','Theme','Trope','Mood','Content warning','Other'].map(x=>`<option>${x}</option>`).join('')}</select><label for="suggestreason">Tell us a little about it (optional)</label><textarea id="suggestreason" rows="3"></textarea><p><button class="primary">Submit suggestion</button></p></form><small>Demo only: suggestions are saved on this device.</small></section>`}function suggestTag(e){e.preventDefault();let name=$('suggestname').value.trim();if(!name)return;state.tagSuggestions=state.tagSuggestions||[];state.tagSuggestions.push({name,category:$('suggestcategory').value,reason:$('suggestreason').value});save();e.target.reset();notify('Suggestion saved for this demo')}let editionIndex=0;
function editionAuthors(p){return [...new Set(p.ids.map(id=>by(id).author))]}
function editionCover(p){return `<div class="editioncover"><small>BOOK BUILDER · PERSONAL COLLECTION</small><h2 style="--title-size:${p.title.length>60?18:p.title.length>35?21:26}px">${esc(p.title)}</h2><small>${p.ids.length} stories · ${editionAuthors(p).length} authors</small></div>`}
function viewEdition(i){let h=snapshot();editionIndex=i;go('Edition',h)}
function edition(){let p=state.purchases[editionIndex];if(!p)return library();return `${backLink()}<h1>${esc(p.title)}</h1><div class="editionpreview">${editionCover(p)}<section><p>${p.ids.length} stories · ${editionAuthors(p).length} authors · ${duration(p.ids.reduce((n,id)=>n+by(id).mins,0))}</p><p><strong>Contributing authors</strong><br>${esc(editionAuthors(p).join(', '))}</p><div class="actions"><button class="primary" onclick="downloadEdition(${editionIndex})">Download sample book (HTML)</button></div><p class="muted">Prototype edition: cover, contents and story descriptions only. Full manuscripts and audio are not included.</p><h2>Table of contents</h2><ol class="editiontoc">${p.ids.map(id=>{let s=by(id);return `<li><button class="link" onclick="showStory(${id})">${esc(s.title)}</button><small>${esc(s.author)} · ${s.mins} min read</small></li>`}).join('')}</ol></section></div>`}
function downloadEdition(i){let p=state.purchases[i];if(!p)return;let html=`<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.title)}</title><style>body{font:18px/1.6 Georgia,serif;max-width:680px;margin:auto;padding:24px;color:#29242e;background:#fcfbf8}header{background:#373149;color:white;padding:48px 28px;border-radius:8px}h1{overflow-wrap:anywhere}a{color:#6026b9}section{border-top:1px solid #ddd;padding:20px 0}@media print{header{break-after:page}section{break-inside:avoid}}</style><header><p>BOOK BUILDER · PERSONAL COLLECTION</p><h1>${esc(p.title)}</h1><p>${esc(editionAuthors(p).join(', '))}</p><p>${p.ids.length} stories · ${duration(p.ids.reduce((n,id)=>n+by(id).mins,0))}</p></header><p><strong>Prototype sample edition.</strong> Story descriptions only; no manuscripts or audio included.</p><h2>Table of contents</h2><ol>${p.ids.map((id,j)=>`<li><a href="#story${j}">${esc(by(id).title)}</a> — ${esc(by(id).author)}</li>`).join('')}</ol>${p.ids.map((id,j)=>{let s=by(id);return `<section id="story${j}"><h2>${esc(s.title)}</h2><p>${esc(s.author)} · ${s.mins} min read</p><p>${esc(s.desc)}</p><small>Story description — full text not included in this prototype.</small></section>`}).join('')}</html>`;let url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download=(p.title.replace(/[^a-z0-9 _-]/gi,'').trim().replace(/\s+/g,'-')||'my-book')+'-sample.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function render(){$('nav').innerHTML=`<button class="brand" onclick="go('Home')">▥ Book Builder</button>${['Home','Discover','Collections','My Library','My Book'].map(p=>`<button class="${p==='My Book'?'basket':page===p?'active':''}" ${page===p?'aria-current="page"':''} onclick="go('${p}')">${p}${p==='My Book'?' ('+state.book.length+')':''}</button>`).join('')}`;$('main').innerHTML=({Home:home,Discover:discovery,Collections:()=>`<h1>Curated collections</h1><p>Handpicked starting points. Make any collection your own.</p>${collectionCards()}`,'Tag Explorer':tagExplorer,Story:story,Edition:edition,Author:author,Collection:collection,'My Book':book,'My Library':library}[page]||home)();if(page==='Discover')results();fitCovers()}function fitCovers(){document.querySelectorAll('.cover b').forEach(el=>{el.style.fontSize='';let size=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>el.clientWidth+1&&size>5){size-=.5;el.style.fontSize=size+'px'}})}window.addEventListener('resize',fitCovers);function resetDemo(){if(confirm('Reset your demo library, selections and preferences?')){try{localStorage.removeItem('bookbuilder04');localStorage.removeItem('bookbuilder03');localStorage.removeItem('bookbuilder02');localStorage.removeItem('bookbuilder01')}catch(e){}location.reload()}}render();</script></body></html>
